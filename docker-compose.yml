services:
  app:
    build: .
    image: oneread:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      # Optional. Blank means a key is generated into /data and reused, which
      # is fine for a single container. Set it (openssl rand -base64 48) if you
      # run more than one, or want the key outside the data volume.
      ONEREAD_SECRET_KEY: ${ONEREAD_SECRET_KEY:-}
      # Behind TLS this must be true, or session cookies travel in the clear.
      ONEREAD_COOKIE_SECURE: ${ONEREAD_COOKIE_SECURE:-false}
      ONEREAD_ALLOWED_HOSTS: ${ONEREAD_ALLOWED_HOSTS:-*}
      ONEREAD_ALLOW_REGISTRATION: ${ONEREAD_ALLOW_REGISTRATION:-true}
      # Off here on purpose: this file is somebody's own machine, and robots.txt
      # accordingly tells every crawler to go away.
      ONEREAD_PUBLIC_SITE: ${ONEREAD_PUBLIC_SITE:-false}
      ONEREAD_PUBLIC_URL: ${ONEREAD_PUBLIC_URL:-}
      ONEREAD_MAX_TEXT_CHARS: ${ONEREAD_MAX_TEXT_CHARS:-100000}
      ONEREAD_GENERATE_PER_HOUR: ${ONEREAD_GENERATE_PER_HOUR:-30}
    # Synthesis is CPU-bound. Give it room, or audio takes a while.
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 3g

# This file is for running it on your own machine: one container, plain http,
# port 8000 on the host. It is not the file to put on the internet.
#
# For that there is docker-compose.prod.yml — the same app behind an nginx that
# terminates TLS, with certbot renewing the certificate, the app's port off the
# host entirely, and proxy headers wired up so rate limits still see real
# addresses. See "Putting it on the internet" in the README.
