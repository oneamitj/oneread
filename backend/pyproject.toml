[project]
name = "oneread"
version = "0.1.0"
description = "Local text-to-speech library powered by Supertonic"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "soundfile>=0.12",
    "numpy>=1.26",
    "markdown-it-py>=3.0",
    "supertonic==1.3.1",
    # Reading uploaded documents. All pure Python, so the image stays small
    # and nothing shells out; the 1990s .doc and .ppt formats have no reader
    # of that kind and are handled by LibreOffice when it happens to be there.
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "pypdf>=5.0",
    "xlrd>=2.0",
    "odfpy>=1.4",
    "striprtf>=0.0.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oneread"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
