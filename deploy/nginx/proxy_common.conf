# Included by every proxying location. Kept in one file because the important
# line below is easy to get wrong in one copy out of four.

proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;

# $remote_addr, not $proxy_add_x_forwarded_for. The usual "add" form appends the
# peer to whatever the client sent, so a client that sends its own
# X-Forwarded-For puts a value of its choosing *first* in the list — and first
# is what the app reads to key its rate limits on. Overwriting means the header
# says what the connection says, and a client cannot move its own bucket.
#
# This is only correct because nothing sits in front of this nginx. Put a CDN or
# a load balancer ahead of it and this line has to become a trusted-hop parse
# instead, or every visitor becomes that one device.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto https;

proxy_connect_timeout 5s;
# Generous: the routes that reflow text parse up to 100k characters, and there
# is one worker serving everybody. Synthesis itself is queued in the background
# and answers immediately, so this is not the audio path's budget.
proxy_send_timeout    300s;
proxy_read_timeout    300s;

# Don't let an upstream 502/504 leak nginx's own error page shape into a client
# that's expecting the app's `{"message": "..."}`. There's nothing to do about
# the body, but the status is at least honest.
proxy_intercept_errors off;
