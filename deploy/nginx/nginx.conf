# Main nginx configuration for the production stack. The per-site part lives in
# ../templates/oneread.conf.template, which the image's entrypoint renders into
# /etc/nginx/conf.d and the last line here includes.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Don't advertise the version in headers or on error pages. It saves nobody
    # any work but us, when a scanner has to try everything instead of what's
    # known to be broken in this exact build.
    server_tokens off;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    # $remote_addr rather than an X-Forwarded-For that nobody in front of us
    # writes: this nginx is the edge, so the peer address is the real one.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log main;

    # Slow-request timeouts. A client that opens a connection and dribbles a
    # header a minute is holding a worker slot for free without these.
    client_header_timeout 15s;
    client_body_timeout   60s;
    send_timeout          120s;
    keepalive_timeout     65s;
    reset_timedout_connection on;

    # Has to sit above ONEREAD_MAX_UPLOAD_BYTES (25 MB by default) with room for
    # the multipart wrapper, or nginx refuses uploads the app would have
    # accepted — and does it with its own error page rather than the app's
    # message. Raise both together, never just one.
    client_max_body_size    30m;
    client_body_buffer_size 256k;
    large_client_header_buffers 4 16k;

    # Not gzipping here on purpose: the app gzips its own responses (starlette's
    # GZipMiddleware, over 1 KB), and nginx won't recompress what already
    # arrived encoded. Turning it on would only add a second implementation to
    # keep an eye on.
    gzip off;

    # Defence in depth, not the actual limit. The app meters sign-ins, synthesis
    # and uploads per account and per address already; these are here so a flood
    # is dropped before it reaches the single uvicorn worker at all.
    #
    # `auth` is deliberately close to ONEREAD_LOGIN_PER_MINUTE. `api` is loose
    # because the editor calls the text endpoints while you type.
    limit_req_zone  $binary_remote_addr zone=auth:10m rate=12r/m;
    limit_req_zone  $binary_remote_addr zone=api:10m  rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;
    limit_req_status  429;
    limit_conn_status 429;

    include /etc/nginx/conf.d/*.conf;
}
